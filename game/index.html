<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2048 - 溪_</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #3c4858;
      background: linear-gradient(135deg, #f7efe5, #e8f0ff);
    }
    .game-wrap {
      width: min(92vw, 460px);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 54px;
      line-height: 1;
      color: #776e65;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      min-width: 78px;
      padding: 8px 12px;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      background: #bbada0;
      box-shadow: 0 8px 24px rgba(119, 110, 101, .16);
    }
    .score-box span {
      display: block;
      font-size: 12px;
      opacity: .8;
    }
    .score-box strong {
      font-size: 22px;
    }
    .intro {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: #776e65;
    }
    button, .home-link {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      background: #8f7a66;
      text-decoration: none;
      white-space: nowrap;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      background: #bbada0;
      box-shadow: 0 18px 50px rgba(119, 110, 101, .22);
      touch-action: none;
    }
    .cell {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: clamp(26px, 8vw, 46px);
      font-weight: 800;
      background: rgba(238, 228, 218, .35);
      color: #776e65;
      transition: transform .08s ease, background .12s ease;
    }
    .tile-2 { background: #eee4da; }
    .tile-4 { background: #ede0c8; }
    .tile-8 { color: #f9f6f2; background: #f2b179; }
    .tile-16 { color: #f9f6f2; background: #f59563; }
    .tile-32 { color: #f9f6f2; background: #f67c5f; }
    .tile-64 { color: #f9f6f2; background: #f65e3b; }
    .tile-128 { color: #f9f6f2; background: #edcf72; font-size: clamp(22px, 7vw, 38px); }
    .tile-256 { color: #f9f6f2; background: #edcc61; font-size: clamp(22px, 7vw, 38px); }
    .tile-512 { color: #f9f6f2; background: #edc850; font-size: clamp(22px, 7vw, 38px); }
    .tile-1024 { color: #f9f6f2; background: #edc53f; font-size: clamp(18px, 6vw, 34px); }
    .tile-2048 { color: #f9f6f2; background: #edc22e; font-size: clamp(18px, 6vw, 34px); }
    .status {
      min-height: 26px;
      margin: 16px 0;
      text-align: center;
      font-weight: 700;
      color: #776e65;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    @media (max-width: 420px) {
      body { padding: 14px; }
      h1 { font-size: 44px; }
      .topbar { align-items: flex-start; }
      .scores { flex-direction: column; }
      .board { gap: 9px; padding: 9px; }
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <section class="topbar">
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
        <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
      </div>
    </section>
    <section class="intro">
      <p>用方向键、WASD 或滑动移动方块，合成 2048。</p>
      <button id="restart">新游戏</button>
    </section>
    <section class="board" id="board" aria-label="2048 游戏棋盘"></section>
    <p class="status" id="status"></p>
    <section class="actions">
      <a class="home-link" href="/myblog/">返回首页</a>
      <button id="restart-bottom">重新开始</button>
    </section>
  </main>
  <script>
    const size = 4;
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const statusEl = document.getElementById('status');
    const restartEls = [document.getElementById('restart'), document.getElementById('restart-bottom')];
    let board = [];
    let score = 0;
    let best = Number(localStorage.getItem('myblog-2048-best') || 0);
    let gameOver = false;

<pre><code class="hljs">function startGame() &#123;
  board = Array.from(&#123; length: size &#125;, () =&gt; Array(size).fill(0));
  score = 0;
  gameOver = false;
  statusEl.textContent = &#39;&#39;;
  addTile();
  addTile();
  draw();
&#125;

function addTile() &#123;
  const empty = [];
  for (let r = 0; r &lt; size; r++) &#123;
    for (let c = 0; c &lt; size; c++) &#123;
      if (!board[r][c]) empty.push([r, c]);
    &#125;
  &#125;
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = Math.random() &lt; 0.9 ? 2 : 4;
&#125;

function draw() &#123;
  boardEl.innerHTML = &#39;&#39;;
  board.flat().forEach(value =&gt; &#123;
    const cell = document.createElement(&#39;div&#39;);
    cell.className = &#39;cell&#39; + (value ? ` tile-$&#123;Math.min(value, 2048)&#125;` : &#39;&#39;);
    cell.textContent = value || &#39;&#39;;
    boardEl.appendChild(cell);
  &#125;);
  scoreEl.textContent = score;
  best = Math.max(best, score);
  localStorage.setItem(&#39;myblog-2048-best&#39;, String(best));
  bestEl.textContent = best;
  if (board.flat().includes(2048) &amp;&amp; !gameOver) statusEl.textContent = &#39;太棒了，你合成了 2048！还可以继续挑战更高分。&#39;;
&#125;

function mergeLine(line) &#123;
  const values = line.filter(Boolean);
  const merged = [];
  for (let i = 0; i &lt; values.length; i++) &#123;
    if (values[i] === values[i + 1]) &#123;
      const next = values[i] * 2;
      merged.push(next);
      score += next;
      i++;
    &#125; else &#123;
      merged.push(values[i]);
    &#125;
  &#125;
  while (merged.length &lt; size) merged.push(0);
  return merged;
&#125;

function move(direction) &#123;
  if (gameOver) return;
  const before = JSON.stringify(board);
  if (direction === &#39;left&#39;) &#123;
    board = board.map(mergeLine);
  &#125;
  if (direction === &#39;right&#39;) &#123;
    board = board.map(row =&gt; mergeLine([...row].reverse()).reverse());
  &#125;
  if (direction === &#39;up&#39;) &#123;
    for (let c = 0; c &lt; size; c++) &#123;
      const merged = mergeLine(board.map(row =&gt; row[c]));
      for (let r = 0; r &lt; size; r++) board[r][c] = merged[r];
    &#125;
  &#125;
  if (direction === &#39;down&#39;) &#123;
    for (let c = 0; c &lt; size; c++) &#123;
      const merged = mergeLine(board.map(row =&gt; row[c]).reverse()).reverse();
      for (let r = 0; r &lt; size; r++) board[r][c] = merged[r];
    &#125;
  &#125;
  if (before !== JSON.stringify(board)) &#123;
    addTile();
    draw();
    if (!canMove()) &#123;
      gameOver = true;
      statusEl.textContent = &#39;游戏结束，点击重新开始再来一局。&#39;;
    &#125;
  &#125;
&#125;

function canMove() &#123;
  if (board.flat().some(value =&gt; value === 0)) return true;
  for (let r = 0; r &lt; size; r++) &#123;
    for (let c = 0; c &lt; size; c++) &#123;
      if (board[r][c] === board[r][c + 1] || (board[r + 1] &amp;&amp; board[r][c] === board[r + 1][c])) return true;
    &#125;
  &#125;
  return false;
&#125;

const keys = &#123;
  ArrowLeft: &#39;left&#39;, a: &#39;left&#39;, A: &#39;left&#39;,
  ArrowRight: &#39;right&#39;, d: &#39;right&#39;, D: &#39;right&#39;,
  ArrowUp: &#39;up&#39;, w: &#39;up&#39;, W: &#39;up&#39;,
  ArrowDown: &#39;down&#39;, s: &#39;down&#39;, S: &#39;down&#39;
&#125;;

document.addEventListener(&#39;keydown&#39;, event =&gt; &#123;
  const direction = keys[event.key];
  if (!direction) return;
  event.preventDefault();
  move(direction);
&#125;);

let startX = 0;
let startY = 0;
boardEl.addEventListener(&#39;touchstart&#39;, event =&gt; &#123;
  startX = event.touches[0].clientX;
  startY = event.touches[0].clientY;
&#125;, &#123; passive: true &#125;);
boardEl.addEventListener(&#39;touchend&#39;, event =&gt; &#123;
  const touch = event.changedTouches[0];
  const dx = touch.clientX - startX;
  const dy = touch.clientY - startY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) &lt; 30) return;
  move(Math.abs(dx) &gt; Math.abs(dy) ? (dx &gt; 0 ? &#39;right&#39; : &#39;left&#39;) : (dy &gt; 0 ? &#39;down&#39; : &#39;up&#39;));
&#125;);

restartEls.forEach(button =&gt; button.addEventListener(&#39;click&#39;, startGame));
startGame();
</code></pre>
<p>  </script></p>
</body>
</html>
