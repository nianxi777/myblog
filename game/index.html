<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2048 - 溪_</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #3c4858;
      background: linear-gradient(135deg, #f7efe5, #e8f0ff);
    }
    .game-wrap { width: min(92vw, 460px); }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 54px;
      line-height: 1;
      color: #776e65;
    }
    .scores { display: flex; gap: 8px; }
    .score-box {
      min-width: 78px;
      padding: 8px 12px;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      background: #bbada0;
      box-shadow: 0 8px 24px rgba(119, 110, 101, .16);
    }
    .score-box span {
      display: block;
      font-size: 12px;
      opacity: .8;
    }
    .score-box strong { font-size: 22px; }
    .intro {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: #776e65;
    }
    button, .home-link {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      background: #8f7a66;
      text-decoration: none;
      white-space: nowrap;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      background: #bbada0;
      box-shadow: 0 18px 50px rgba(119, 110, 101, .22);
      touch-action: none;
    }
    .cell {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: clamp(26px, 8vw, 46px);
      font-weight: 800;
      background: rgba(238, 228, 218, .35);
      color: #776e65;
    }
    .tile-2 { background: #eee4da; }
    .tile-4 { background: #ede0c8; }
    .tile-8 { color: #f9f6f2; background: #f2b179; }
    .tile-16 { color: #f9f6f2; background: #f59563; }
    .tile-32 { color: #f9f6f2; background: #f67c5f; }
    .tile-64 { color: #f9f6f2; background: #f65e3b; }
    .tile-128 { color: #f9f6f2; background: #edcf72; font-size: clamp(22px, 7vw, 38px); }
    .tile-256 { color: #f9f6f2; background: #edcc61; font-size: clamp(22px, 7vw, 38px); }
    .tile-512 { color: #f9f6f2; background: #edc850; font-size: clamp(22px, 7vw, 38px); }
    .tile-1024 { color: #f9f6f2; background: #edc53f; font-size: clamp(18px, 6vw, 34px); }
    .tile-2048 { color: #f9f6f2; background: #edc22e; font-size: clamp(18px, 6vw, 34px); }
    .status {
      min-height: 26px;
      margin: 16px 0;
      text-align: center;
      font-weight: 700;
      color: #776e65;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      justify-content: center;
      gap: 8px;
      margin: 16px 0 6px;
    }
    .controls button {
      height: 46px;
      padding: 0;
      font-size: 20px;
    }
    .controls .up { grid-column: 2; }
    .controls .left { grid-column: 1; }
    .controls .down { grid-column: 2; }
    .controls .right { grid-column: 3; }
    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    @media (max-width: 420px) {
      body { padding: 14px; }
      h1 { font-size: 44px; }
      .topbar { align-items: flex-start; }
      .scores { flex-direction: column; }
      .board { gap: 9px; padding: 9px; }
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <section class="topbar">
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
        <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
      </div>
    </section>
    <section class="intro">
      <p>用方向键、WASD 或滑动移动方块，合成 2048。</p>
      <button id="restart">新游戏</button>
    </section>
    <section class="board" id="board" aria-label="2048 游戏棋盘"></section>
    <section class="controls" aria-label="方向控制">
      <button class="up" data-move="up" aria-label="向上">↑</button>
      <button class="left" data-move="left" aria-label="向左">←</button>
      <button class="down" data-move="down" aria-label="向下">↓</button>
      <button class="right" data-move="right" aria-label="向右">→</button>
    </section>
    <p class="status" id="status"></p>
    <section class="actions">
      <a class="home-link" href="/myblog/">返回首页</a>
      <button id="restart-bottom">重新开始</button>
    </section>
  </main>
  <script>
    const size = 4;
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const statusEl = document.getElementById('status');
    const restartEls = [document.getElementById('restart'), document.getElementById('restart-bottom')];
    let board = [];
    let score = 0;
    let best = Number(localStorage.getItem('myblog-2048-best') || 0);
    let gameOver = false;

    function startGame() {
      board = Array.from({ length: size }, () => Array(size).fill(0));
      score = 0;
      gameOver = false;
      statusEl.textContent = '';
      addTile();
      addTile();
      draw();
    }

    function addTile() {
      const empty = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!board[r][c]) empty.push([r, c]);
        }
      }
      if (!empty.length) return;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function draw() {
      boardEl.innerHTML = '';
      board.flat().forEach(value => {
        const cell = document.createElement('div');
        cell.className = 'cell' + (value ? ` tile-${Math.min(value, 2048)}` : '');
        cell.textContent = value || '';
        boardEl.appendChild(cell);
      });
      scoreEl.textContent = score;
      best = Math.max(best, score);
      localStorage.setItem('myblog-2048-best', String(best));
      bestEl.textContent = best;
      if (board.flat().includes(2048) && !gameOver) statusEl.textContent = '太棒了，你合成了 2048！还可以继续挑战更高分。';
    }

    function mergeLine(line) {
      const values = line.filter(Boolean);
      const merged = [];
      for (let i = 0; i < values.length; i++) {
        if (values[i] === values[i + 1]) {
          const next = values[i] * 2;
          merged.push(next);
          score += next;
          i++;
        } else {
          merged.push(values[i]);
        }
      }
      while (merged.length < size) merged.push(0);
      return merged;
    }

    function move(direction) {
      if (gameOver) return;
      const before = JSON.stringify(board);
      if (direction === 'left') board = board.map(mergeLine);
      if (direction === 'right') board = board.map(row => mergeLine([...row].reverse()).reverse());
      if (direction === 'up') {
        for (let c = 0; c < size; c++) {
          const merged = mergeLine(board.map(row => row[c]));
          for (let r = 0; r < size; r++) board[r][c] = merged[r];
        }
      }
      if (direction === 'down') {
        for (let c = 0; c < size; c++) {
          const merged = mergeLine(board.map(row => row[c]).reverse()).reverse();
          for (let r = 0; r < size; r++) board[r][c] = merged[r];
        }
      }
      if (before !== JSON.stringify(board)) {
        addTile();
        draw();
        if (!canMove()) {
          gameOver = true;
          statusEl.textContent = '游戏结束，点击重新开始再来一局。';
        }
      }
    }

    function canMove() {
      if (board.flat().some(value => value === 0)) return true;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === board[r][c + 1] || (board[r + 1] && board[r][c] === board[r + 1][c])) return true;
        }
      }
      return false;
    }

    const keys = {
      ArrowLeft: 'left', a: 'left', A: 'left',
      ArrowRight: 'right', d: 'right', D: 'right',
      ArrowUp: 'up', w: 'up', W: 'up',
      ArrowDown: 'down', s: 'down', S: 'down'
    };

    document.addEventListener('keydown', event => {
      const direction = keys[event.key];
      if (!direction) return;
      event.preventDefault();
      move(direction);
    });

    let startX = 0;
    let startY = 0;
    boardEl.addEventListener('touchstart', event => {
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    }, { passive: true });
    boardEl.addEventListener('touchend', event => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
      move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    });

    document.querySelectorAll('[data-move]').forEach(button => {
      button.addEventListener('click', () => move(button.dataset.move));
    });
    restartEls.forEach(button => button.addEventListener('click', startGame));
    startGame();
  </script>
</body>
</html>
