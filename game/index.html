<body>
  <main class="game-wrap">
    <section class="topbar">
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
        <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
      </div>
    </section>
    <section class="intro">
      <p>用方向键、WASD 或滑动移动方块，合成 2048。</p>
      <button id="restart">新游戏</button>
    </section>
    <section class="board" id="board" aria-label="2048 游戏棋盘"></section>
    <p class="status" id="status"></p>
    <section class="actions">
      <a class="home-link" href="/myblog/">返回首页</a>
      <button id="restart-bottom">重新开始</button>
    </section>
  </main>
  <script>
    const size = 4;
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const statusEl = document.getElementById('status');
    const restartEls = [document.getElementById('restart'), document.getElementById('restart-bottom')];
    let board = [];
    let score = 0;
    let best = Number(localStorage.getItem('myblog-2048-best') || 0);
    let gameOver = false;

    function startGame() {
      board = Array.from({ length: size }, () => Array(size).fill(0));
      score = 0;
      gameOver = false;
      statusEl.textContent = '';
      addTile();
      addTile();
      draw();
    }

    function addTile() {
      const empty = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!board[r][c]) empty.push([r, c]);
        }
      }
      if (!empty.length) return;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function draw() {
      boardEl.innerHTML = '';
      board.flat().forEach(value => {
        const cell = document.createElement('div');
        cell.className = 'cell' + (value ? ` tile-${Math.min(value, 2048)}` : '');
        cell.textContent = value || '';
        boardEl.appendChild(cell);
      });
      scoreEl.textContent = score;
      best = Math.max(best, score);
      localStorage.setItem('myblog-2048-best', String(best));
      bestEl.textContent = best;
      if (board.flat().includes(2048) && !gameOver) statusEl.textContent = '太棒了，你合成了 2048！还可以继续挑战更高分。';
    }

    function mergeLine(line) {
      const values = line.filter(Boolean);
      const merged = [];
      for (let i = 0; i < values.length; i++) {
        if (values[i] === values[i + 1]) {
          const next = values[i] * 2;
          merged.push(next);
          score += next;
          i++;
        } else {
          merged.push(values[i]);
        }
      }
      while (merged.length < size) merged.push(0);
      return merged;
    }

    function move(direction) {
      if (gameOver) return;
      const before = JSON.stringify(board);
      if (direction === 'left') board = board.map(mergeLine);
      if (direction === 'right') board = board.map(row => mergeLine([...row].reverse()).reverse());
      if (direction === 'up') {
        for (let c = 0; c < size; c++) {
          const merged = mergeLine(board.map(row => row[c]));
          for (let r = 0; r < size; r++) board[r][c] = merged[r];
        }
      }
      if (direction === 'down') {
        for (let c = 0; c < size; c++) {
          const merged = mergeLine(board.map(row => row[c]).reverse()).reverse();
          for (let r = 0; r < size; r++) board[r][c] = merged[r];
        }
      }
      if (before !== JSON.stringify(board)) {
        addTile();
        draw();
        if (!canMove()) {
          gameOver = true;
          statusEl.textContent = '游戏结束，点击重新开始再来一局。';
        }
      }
    }

    function canMove() {
      if (board.flat().some(value => value === 0)) return true;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === board[r][c + 1] || (board[r + 1] && board[r][c] === board[r + 1][c])) return true;
        }
      }
      return false;
    }

    const keys = {
      ArrowLeft: 'left', a: 'left', A: 'left',
      ArrowRight: 'right', d: 'right', D: 'right',
      ArrowUp: 'up', w: 'up', W: 'up',
      ArrowDown: 'down', s: 'down', S: 'down'
    };

    document.addEventListener('keydown', event => {
      const direction = keys[event.key];
      if (!direction) return;
      event.preventDefault();
      move(direction);
    });

    let startX = 0;
    let startY = 0;
    boardEl.addEventListener('touchstart', event => {
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    }, { passive: true });
    boardEl.addEventListener('touchend', event => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
      move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    });

    restartEls.forEach(button => button.addEventListener('click', startGame));
    startGame();
  </script>
