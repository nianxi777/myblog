<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2048 - 溪_</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #3c4858;
      background: linear-gradient(135deg, #eef2f7, #dbe6f1);
    }
    .game-wrap {
      width: min(96vw, 760px);
      max-height: calc(100vh - 24px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 230px;
      gap: 18px;
      align-items: center;
    }
    .board-panel { min-width: 0; }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .topbar {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 8vh, 50px);
      line-height: 1;
      color: #2f4154;
    }
    .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
    .score-box {
      min-width: 0;
      padding: 7px 9px;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      background: #2f4154;
    }
    .score-box span { display: block; font-size: 12px; opacity: .85; }
    .score-box strong { font-size: 20px; }
    .intro {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      color: #2f4154;
    }
    .intro p { margin: 0; line-height: 1.45; font-size: 14px; }
    button, .home-link {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      background: #2f4154;
      text-decoration: none;
      white-space: nowrap;
      font-family: inherit;
      transition: background .2s ease, transform .2s ease;
    }
    button:hover, .home-link:hover {
      background: #30a9de;
      transform: translateY(-1px);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: min(1.7vw, 9px);
      padding: min(1.7vw, 9px);
      border-radius: 16px;
      background: #2f4154;
      touch-action: none;
      user-select: none;
    }
    .cell {
      position: relative;
      width: 100%;
      padding-top: 100%;
      border-radius: 10px;
      background: rgba(255, 255, 255, .18);
      color: #2f4154;
      font-weight: 800;
    }
    .cell span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(26px, 7vw, 36px);
    }
    .tile-2 { background: #f8fafc; }
    .tile-4 { background: #e2e8f0; }
    .tile-8 { color: #fff; background: #a7b4c4; }
    .tile-16 { color: #fff; background: #8798ad; }
    .tile-32 { color: #fff; background: #687d96; }
    .tile-64 { color: #fff; background: #506982; }
    .tile-128 { color: #fff; background: #30a9de; }
    .tile-256 { color: #fff; background: #238fc1; }
    .tile-512 { color: #fff; background: #17759f; }
    .tile-1024 { color: #fff; background: #24506f; }
    .tile-2048 { color: #fff; background: #1f3144; }
    .tile-128 span, .tile-256 span, .tile-512 span { font-size: clamp(23px, 6vw, 30px); }
    .tile-1024 span, .tile-2048 span { font-size: clamp(20px, 5vw, 25px); }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      justify-content: center;
      gap: 6px;
      margin: 0;
    }
    .controls button { height: 38px; padding: 0; font-size: 20px; }
    .controls .up { grid-column: 2; }
    .controls .left { grid-column: 1; }
    .controls .down { grid-column: 2; }
    .controls .right { grid-column: 3; }
    .status {
      min-height: 44px;
      margin: 0;
      text-align: left;
      font-weight: 700;
      color: #2f4154;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .actions .home-link,
    .actions button,
    .intro button {
      text-align: center;
      width: 100%;
    }
    @media (max-width: 700px) {
      body { padding: 10px; }
      .game-wrap {
        width: min(96vw, 430px);
        display: block;
      }
      .side-panel { gap: 8px; }
      .topbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .scores { width: auto; }
      .score-box { min-width: 64px; padding: 5px 8px; }
      .intro {
        flex-direction: row;
        align-items: center;
        margin-bottom: 10px;
      }
      .intro button { width: auto; }
      .controls { margin: 8px 0 6px; grid-template-columns: repeat(3, 52px); }
      .status { min-height: 22px; margin: 6px 0; text-align: center; }
      .actions { flex-direction: row; justify-content: center; }
      .actions .home-link,
      .actions button { width: auto; }
    }
    @media (max-width: 420px) {
      .topbar { align-items: flex-start; }
      .scores { grid-template-columns: 1fr; gap: 5px; width: 72px; }
      .intro p { font-size: 13px; }
    }
    @media (max-height: 700px) {
      body { padding: 8px; }
      .game-wrap { width: min(96vw, 700px); grid-template-columns: minmax(300px, 1fr) 210px; gap: 12px; }
      h1 { font-size: 38px; }
      .side-panel { gap: 8px; }
      .intro p { font-size: 12px; }
      .actions { display: none; }
    }
    @media (max-width: 700px) and (max-height: 700px) {
      .game-wrap { width: min(92vw, 380px); display: block; }
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <section class="board-panel">
      <section class="board" id="board" aria-label="2048 游戏棋盘"></section>
    </section>
    <aside class="side-panel">
      <section class="topbar">
        <h1>2048</h1>
        <div class="scores">
          <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
          <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
        </div>
      </section>
      <section class="intro">
        <p>用方向键、WASD、滑动或按钮移动方块。</p>
        <button type="button" onclick="newGame()">新游戏</button>
      </section>
      <section class="controls" aria-label="方向控制">
        <button type="button" class="up" onclick="move('up')">↑</button>
        <button type="button" class="left" onclick="move('left')">←</button>
        <button type="button" class="down" onclick="move('down')">↓</button>
        <button type="button" class="right" onclick="move('right')">→</button>
      </section>
      <p class="status" id="status">游戏加载中...</p>
      <section class="actions">
        <a class="home-link" href="/myblog/">返回首页</a>
        <button type="button" onclick="newGame()">重新开始</button>
      </section>
    </aside>
  </main>
  <script>
    var size = 4;
    var board = [];
    var score = 0;
    var best = 0;
    var over = false;
    var startX = 0;
    var startY = 0;

    function getBest() {
      try { return Number(window.localStorage.getItem('myblog-2048-best') || 0); }
      catch (e) { return 0; }
    }

    function saveBest(value) {
      try { window.localStorage.setItem('myblog-2048-best', String(value)); }
      catch (e) {}
    }

    function newGame() {
      board = [];
      for (var r = 0; r < size; r++) {
        board[r] = [];
        for (var c = 0; c < size; c++) board[r][c] = 0;
      }
      score = 0;
      over = false;
      best = getBest();
      document.getElementById('status').innerHTML = '游戏开始，合成 2048！';
      addTile();
      addTile();
      draw();
    }

    function addTile() {
      var empty = [];
      for (var r = 0; r < size; r++) {
        for (var c = 0; c < size; c++) {
          if (board[r][c] === 0) empty.push({ r: r, c: c });
        }
      }
      if (empty.length === 0) return;
      var spot = empty[Math.floor(Math.random() * empty.length)];
      board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
    }

    function draw() {
      var boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (var r = 0; r < size; r++) {
        for (var c = 0; c < size; c++) {
          var value = board[r][c];
          var cell = document.createElement('div');
          cell.className = 'cell' + (value ? ' tile-' + Math.min(value, 2048) : '');
          var span = document.createElement('span');
          span.innerHTML = value ? String(value) : '';
          cell.appendChild(span);
          boardEl.appendChild(cell);
        }
      }
      document.getElementById('score').innerHTML = String(score);
      if (score > best) {
        best = score;
        saveBest(best);
      }
      document.getElementById('best').innerHTML = String(best);
    }

    function mergeLine(line) {
      var values = [];
      var result = [];
      for (var i = 0; i < line.length; i++) {
        if (line[i] !== 0) values.push(line[i]);
      }
      for (var j = 0; j < values.length; j++) {
        if (values[j] === values[j + 1]) {
          var merged = values[j] * 2;
          result.push(merged);
          score += merged;
          j++;
        } else {
          result.push(values[j]);
        }
      }
      while (result.length < size) result.push(0);
      return result;
    }

    function boardText() {
      var text = '';
      for (var r = 0; r < size; r++) text += board[r].join(',') + ';';
      return text;
    }

    function move(direction) {
      if (over) return;
      var before = boardText();
      var r, c, line, merged;

      if (direction === 'left') {
        for (r = 0; r < size; r++) board[r] = mergeLine(board[r]);
      }
      if (direction === 'right') {
        for (r = 0; r < size; r++) {
          line = board[r].slice().reverse();
          board[r] = mergeLine(line).reverse();
        }
      }
      if (direction === 'up') {
        for (c = 0; c < size; c++) {
          line = [];
          for (r = 0; r < size; r++) line.push(board[r][c]);
          merged = mergeLine(line);
          for (r = 0; r < size; r++) board[r][c] = merged[r];
        }
      }
      if (direction === 'down') {
        for (c = 0; c < size; c++) {
          line = [];
          for (r = 0; r < size; r++) line.push(board[r][c]);
          merged = mergeLine(line.reverse()).reverse();
          for (r = 0; r < size; r++) board[r][c] = merged[r];
        }
      }

      if (before !== boardText()) {
        addTile();
        draw();
        if (hasValue(2048)) document.getElementById('status').innerHTML = '你已经合成 2048，可以继续挑战更高分！';
        if (!canMove()) {
          over = true;
          document.getElementById('status').innerHTML = '游戏结束，点击重新开始再来一局。';
        }
      }
    }

    function hasValue(value) {
      for (var r = 0; r < size; r++) {
        for (var c = 0; c < size; c++) if (board[r][c] === value) return true;
      }
      return false;
    }

    function canMove() {
      for (var r = 0; r < size; r++) {
        for (var c = 0; c < size; c++) {
          if (board[r][c] === 0) return true;
          if (c < size - 1 && board[r][c] === board[r][c + 1]) return true;
          if (r < size - 1 && board[r][c] === board[r + 1][c]) return true;
        }
      }
      return false;
    }

    document.onkeydown = function(event) {
      event = event || window.event;
      var key = event.key || event.keyCode;
      var direction = null;
      if (key === 'ArrowLeft' || key === 'a' || key === 'A' || key === 37) direction = 'left';
      if (key === 'ArrowRight' || key === 'd' || key === 'D' || key === 39) direction = 'right';
      if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === 38) direction = 'up';
      if (key === 'ArrowDown' || key === 's' || key === 'S' || key === 40) direction = 'down';
      if (direction) {
        if (event.preventDefault) event.preventDefault();
        move(direction);
        return false;
      }
    };

    document.getElementById('board').ontouchstart = function(event) {
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    };

    document.getElementById('board').ontouchend = function(event) {
      var touch = event.changedTouches[0];
      var dx = touch.clientX - startX;
      var dy = touch.clientY - startY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
    };

    newGame();
  </script>
</body>
</html>
