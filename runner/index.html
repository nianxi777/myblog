<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>跑酷 - 溪_</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #3c4858;
      background: linear-gradient(135deg, #eef2f7, #dbe6f1);
    }
    .game-wrap {
      width: min(96vw, 820px);
      max-height: calc(100vh - 24px);
      display: grid;
      grid-template-columns: minmax(420px, 1fr) 230px;
      gap: 18px;
      align-items: center;
    }
    .board-panel { min-width: 0; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      background: #2f4154;
      box-shadow: 0 18px 40px rgba(31, 49, 68, .18);
      touch-action: none;
    }
    .side-panel { display: flex; flex-direction: column; gap: 12px; }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vh, 46px);
      line-height: 1;
      color: #2f4154;
    }
    .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .score-box {
      padding: 7px 9px;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      background: #2f4154;
    }
    .score-box span { display: block; font-size: 12px; opacity: .85; }
    .score-box strong { font-size: 20px; }
    p { margin: 0; line-height: 1.45; color: #2f4154; font-size: 14px; }
    button, .home-link {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      background: #2f4154;
      text-decoration: none;
      text-align: center;
      font-family: inherit;
      transition: background .2s ease, transform .2s ease;
    }
    button:hover, .home-link:hover { background: #30a9de; transform: translateY(-1px); }
    .big-button { height: 48px; font-size: 17px; }
    .status { min-height: 44px; margin: 0; font-weight: 700; color: #2f4154; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    @media (max-width: 760px) {
      body { padding: 10px; }
      .game-wrap { width: min(96vw, 520px); display: block; }
      .side-panel { gap: 8px; margin-top: 10px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .scores { width: 150px; }
      .score-box { padding: 5px 8px; }
      p { font-size: 13px; }
      .status { min-height: 22px; text-align: center; }
      .actions { flex-direction: row; justify-content: center; }
      .big-button { height: auto; }
    }
    @media (max-height: 650px) {
      body { padding: 8px; }
      .game-wrap { width: min(96vw, 760px); grid-template-columns: minmax(390px, 1fr) 210px; gap: 12px; }
      h1 { font-size: 34px; }
      .side-panel { gap: 8px; }
      p { font-size: 12px; }
      .actions { display: none; }
    }
    @media (max-width: 760px) and (max-height: 650px) {
      .game-wrap { width: min(94vw, 460px); display: block; }
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <section class="board-panel">
      <canvas id="board" width="800" height="450" aria-label="小恐龙跑酷游戏区域"></canvas>
    </section>
    <aside class="side-panel">
      <section class="topbar">
        <h1>跑酷</h1>
        <div class="scores">
          <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
          <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
        </div>
      </section>
      <p>按空格、↑、W 或点击跳跃，躲开障碍物。速度会越来越快。</p>
      <button type="button" class="big-button" onclick="jump()">跳跃</button>
      <p class="status" id="status">游戏加载中...</p>
      <section class="actions">
        <button type="button" onclick="newGame()">新游戏</button>
        <a class="home-link" href="/myblog/">返回首页</a>
      </section>
    </aside>
  </main>
  <script>
    var canvas = document.getElementById('board');
    var ctx = canvas.getContext('2d');
    var groundY = 350;
    var dino = { x: 86, y: groundY - 58, w: 46, h: 58, vy: 0, jumping: false };
    var obstacles = [];
    var clouds = [];
    var score = 0;
    var best = 0;
    var speed = 6;
    var frame = 0;
    var over = false;
    var timer = null;

    function getBest() {
      try { return Number(window.localStorage.getItem('myblog-runner-best') || 0); }
      catch (e) { return 0; }
    }

    function saveBest(value) {
      try { window.localStorage.setItem('myblog-runner-best', String(value)); }
      catch (e) {}
    }

    function newGame() {
      dino.y = groundY - dino.h;
      dino.vy = 0;
      dino.jumping = false;
      obstacles = [];
      clouds = [{ x: 620, y: 78 }, { x: 360, y: 118 }];
      score = 0;
      best = getBest();
      speed = 6;
      frame = 0;
      over = false;
      document.getElementById('status').innerHTML = '游戏开始，准备跳跃！';
      if (timer) clearInterval(timer);
      timer = setInterval(tick, 1000 / 60);
      draw();
    }

    function jump() {
      if (over) {
        newGame();
        return;
      }
      if (!dino.jumping) {
        dino.vy = -16;
        dino.jumping = true;
      }
    }

    function spawnObstacle() {
      var h = 38 + Math.floor(Math.random() * 34);
      var w = 24 + Math.floor(Math.random() * 18);
      obstacles.push({ x: canvas.width + 20, y: groundY - h, w: w, h: h });
    }

    function update() {
      frame++;
      speed = 6 + Math.min(8, Math.floor(score / 350));
      dino.vy += 0.8;
      dino.y += dino.vy;
      if (dino.y >= groundY - dino.h) {
        dino.y = groundY - dino.h;
        dino.vy = 0;
        dino.jumping = false;
      }

      if (frame % Math.max(55, 105 - Math.floor(score / 45)) === 0) spawnObstacle();
      for (var i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed;
        if (obstacles[i].x + obstacles[i].w < 0) obstacles.splice(i, 1);
      }
      for (var c = 0; c < clouds.length; c++) {
        clouds[c].x -= speed * 0.18;
        if (clouds[c].x < -80) {
          clouds[c].x = canvas.width + 40;
          clouds[c].y = 60 + Math.random() * 80;
        }
      }
      for (var j = 0; j < obstacles.length; j++) {
        if (hit(dino, obstacles[j])) endGame();
      }
      if (!over) score++;
      if (score > best) {
        best = score;
        saveBest(best);
      }
    }

    function hit(a, b) {
      return a.x + 8 < b.x + b.w && a.x + a.w - 8 > b.x && a.y + 6 < b.y + b.h && a.y + a.h > b.y;
    }

    function endGame() {
      over = true;
      clearInterval(timer);
      document.getElementById('status').innerHTML = '游戏结束，点击跳跃或新游戏再来一次。';
      draw();
    }

    function drawDino() {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(dino.x, dino.y + 12, dino.w, dino.h - 12);
      ctx.fillRect(dino.x + 26, dino.y, 28, 26);
      ctx.fillStyle = '#2f4154';
      ctx.fillRect(dino.x + 45, dino.y + 8, 5, 5);
      ctx.fillStyle = '#a7b4c4';
      ctx.fillRect(dino.x + 8, dino.y + dino.h - 8, 12, 8);
      ctx.fillRect(dino.x + 30, dino.y + dino.h - 8, 12, 8);
    }

    function drawObstacle(o) {
      ctx.fillStyle = '#30a9de';
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.fillStyle = '#238fc1';
      ctx.fillRect(o.x + o.w * .55, o.y + 10, o.w * .38, 10);
      ctx.fillRect(o.x + o.w * .08, o.y + 20, o.w * .35, 10);
    }

    function drawCloud(x, y) {
      ctx.fillStyle = 'rgba(248,250,252,.75)';
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.arc(x + 18, y - 8, 20, 0, Math.PI * 2);
      ctx.arc(x + 42, y, 15, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#2f4154';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (var c = 0; c < clouds.length; c++) drawCloud(clouds[c].x, clouds[c].y);
      ctx.strokeStyle = '#a7b4c4';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(40, groundY);
      ctx.lineTo(canvas.width - 40, groundY);
      ctx.stroke();
      drawDino();
      for (var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
      ctx.fillStyle = 'rgba(248,250,252,.16)';
      for (var x = -(frame * speed % 40); x < canvas.width; x += 40) {
        ctx.fillRect(x, groundY + 18, 20, 3);
      }
      document.getElementById('score').innerHTML = String(score);
      document.getElementById('best').innerHTML = String(best);
    }

    function tick() {
      if (over) return;
      update();
      draw();
    }

    document.onkeydown = function(event) {
      event = event || window.event;
      var key = event.key || event.keyCode;
      if (key === ' ' || key === 'ArrowUp' || key === 'w' || key === 'W' || key === 32 || key === 38) {
        if (event.preventDefault) event.preventDefault();
        jump();
        return false;
      }
    };

    canvas.onclick = jump;
    canvas.ontouchstart = function(event) {
      if (event.preventDefault) event.preventDefault();
      jump();
      return false;
    };

    newGame();
  </script>
</body>
</html>
