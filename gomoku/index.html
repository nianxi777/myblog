<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>五子棋 - 溪_</title>
  <link rel="stylesheet" href="../css/games/gomoku.css?v=20260505-4">
</head>
<body>
  <main class="game-wrap">
    <section class="board-panel">
      <canvas id="board" width="600" height="600" aria-label="五子棋棋盘"></canvas>
    </section>
    <aside class="side-panel">
      <section class="topbar">
        <h1>五子棋</h1>
        <div class="scores">
          <div class="score-box"><span>黑棋</span><strong id="blackCount">0</strong></div>
          <div class="score-box"><span>白棋</span><strong id="whiteCount">0</strong></div>
        </div>
      </section>
      <p id="intro">人机模式：你执黑先手，电脑执白后手。</p>
      <section class="game-buttons">
        <button type="button" onclick="newGame()">新游戏</button>
        <button type="button" onclick="undoMove()" id="undoBtn">悔棋</button>
        <button type="button" onclick="toggleMode()" id="modeBtn">模式：人机</button>
        <button type="button" onclick="cycleDifficulty()" id="difficultyBtn">难度：简单</button>
      </section>
      <p class="status" id="status">游戏加载中...</p>
      <section class="actions">
        <a class="home-link" href="/myblog/">返回首页</a>
      </section>
    </aside>
  </main>
  <section class="result-modal" id="resultModal" aria-label="游戏结果弹窗">
    <div class="result-card">
      <h2 id="resultTitle">游戏结束</h2>
      <p id="resultMessage">点击确定关闭弹窗，可继续查看棋盘。</p>
      <div class="result-actions">
        <button type="button" onclick="closeResultModal()">确定</button>
        <button type="button" onclick="newGame()">再来一局</button>
      </div>
    </div>
  </section>
  <script src="../js/games/gomoku.js?v=20260505-2"></script>
</body>
</html>
