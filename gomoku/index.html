<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>五子棋 - 溪_</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #eef8ff;
      background: radial-gradient(circle at 14% 18%, rgba(29, 211, 176, .22), transparent 28%), radial-gradient(circle at 88% 8%, rgba(48, 169, 222, .28), transparent 30%), linear-gradient(135deg, #050a14 0%, #07111f 48%, #10182c 100%);
    }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(104, 213, 255, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(104, 213, 255, .07) 1px, transparent 1px); background-size: 42px 42px; mask-image: radial-gradient(circle, rgba(0,0,0,.86), transparent 78%); }
    .game-wrap { position: relative; z-index: 1; width: min(96vw, 800px); max-height: calc(100vh - 28px); display: grid; grid-template-columns: minmax(320px, 1fr) 238px; gap: 20px; align-items: center; }
    .board-panel { min-width: 0; padding: clamp(10px, 1.8vw, 16px); border: 1px solid rgba(104, 213, 255, .24); border-radius: 26px; background: linear-gradient(145deg, rgba(13, 27, 47, .70), rgba(8, 16, 31, .54)); box-shadow: 0 0 36px rgba(29, 211, 176, .16), 0 28px 70px rgba(0,0,0,.32); backdrop-filter: blur(12px); }
    canvas { display: block; width: 100%; aspect-ratio: 1; border: 1px solid rgba(104, 213, 255, .34); border-radius: 20px; background: #07111f; box-shadow: inset 0 0 28px rgba(48, 213, 255, .10), 0 0 30px rgba(29, 211, 176, .18); touch-action: none; }
    .side-panel { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid rgba(104, 213, 255, .24); border-radius: 24px; background: rgba(13, 27, 47, .78); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 20px 50px rgba(0,0,0,.28); backdrop-filter: blur(12px); }
    .topbar { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
    h1 { margin: 0; font-size: clamp(34px, 7vh, 48px); line-height: 1; color: #eef8ff; letter-spacing: .04em; text-shadow: 0 0 24px rgba(29, 211, 176, .48); }
    .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
    .score-box { padding: 9px 10px; border: 1px solid rgba(104, 213, 255, .28); border-radius: 14px; text-align: center; color: #eef8ff; background: linear-gradient(145deg, rgba(29, 211, 176, .16), rgba(48, 169, 222, .12)); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
    .score-box span { display: block; font-size: 12px; color: #a9c7dc; }
    .score-box strong { font-size: 22px; color: #fff; }
    p { margin: 0; line-height: 1.55; color: #a9c7dc; font-size: 14px; }
    button, .home-link { border: 1px solid rgba(104, 213, 255, .34); border-radius: 12px; padding: 9px 13px; cursor: pointer; font-weight: 800; color: #f7fbff; background: linear-gradient(135deg, rgba(29, 211, 176, .72), rgba(48, 169, 222, .70)); text-decoration: none; text-align: center; font-family: inherit; box-shadow: 0 10px 24px rgba(29, 211, 176, .16); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, filter .18s ease; }
    button:hover, .home-link:hover { transform: translateY(-2px); border-color: rgba(104, 213, 255, .72); box-shadow: 0 0 24px rgba(29, 211, 176, .30); filter: brightness(1.08); }
    button:active, .home-link:active { transform: translateY(0); }
    .status { min-height: 44px; margin: 0; font-weight: 800; line-height: 1.45; color: #d8edff; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .result-modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(2, 8, 18, .42); backdrop-filter: blur(3px); }
    .result-modal.show { display: flex; }
    .result-card { width: min(92vw, 360px); padding: 28px 24px; border: 1px solid rgba(104, 213, 255, .36); border-radius: 24px; text-align: center; color: #eef8ff; background: linear-gradient(145deg, rgba(13, 27, 47, .94), rgba(8, 16, 31, .90)); box-shadow: 0 0 34px rgba(29, 211, 176, .24), 0 28px 70px rgba(0,0,0,.42); }
    .result-card h2 { margin: 0 0 12px; font-size: 30px; text-shadow: 0 0 22px rgba(48, 213, 255, .46); }
    .result-card p { margin-bottom: 20px; color: #d8edff; }
    .result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 700px) {
      body { padding: 10px; align-items: flex-start; overflow: auto; }
      .game-wrap { width: min(96vw, 430px); max-height: none; display: block; }
      .board-panel { padding: 10px; }
      .side-panel { gap: 9px; margin-top: 10px; padding: 12px; }
      .topbar { display: flex; flex-direction: row; justify-content: space-between; align-items: center; gap: 10px; }
      .scores { width: 156px; }
      .score-box { padding: 6px 8px; }
      p { font-size: 13px; }
      .status { min-height: 22px; text-align: center; }
      .actions { flex-direction: row; justify-content: center; flex-wrap: wrap; }
    }
    @media (max-height: 700px) and (min-width: 701px) {
      body { padding: 8px; }
      .game-wrap { width: min(96vw, 720px); grid-template-columns: minmax(300px, 1fr) 216px; gap: 12px; }
      h1 { font-size: 34px; }
      .side-panel { gap: 8px; padding: 12px; }
      p { font-size: 12px; }
    }
    @media (max-width: 700px) and (max-height: 700px) { .game-wrap { width: min(92vw, 380px); } }
  </style>
</head>
<body>
  <main class="game-wrap">
    <section class="board-panel">
      <canvas id="board" width="600" height="600" aria-label="五子棋棋盘"></canvas>
    </section>
    <aside class="side-panel">
      <section class="topbar">
        <h1>五子棋</h1>
        <div class="scores">
          <div class="score-box"><span>黑棋</span><strong id="blackCount">0</strong></div>
          <div class="score-box"><span>白棋</span><strong id="whiteCount">0</strong></div>
        </div>
      </section>
      <p id="intro">人机模式：你执黑先手，电脑执白后手。</p>
      <button type="button" onclick="newGame()">新游戏</button>
      <button type="button" onclick="toggleMode()" id="modeBtn">模式：人机</button>
      <button type="button" onclick="cycleDifficulty()" id="difficultyBtn">难度：简单</button>
      <p class="status" id="status">游戏加载中...</p>
      <section class="actions">
        <a class="home-link" href="/myblog/">返回首页</a>
      </section>
    </aside>
  </main>
  <section class="result-modal" id="resultModal" aria-label="游戏结果弹窗">
    <div class="result-card">
      <h2 id="resultTitle">游戏结束</h2>
      <p id="resultMessage">点击确定关闭弹窗，可继续查看棋盘。</p>
      <div class="result-actions">
        <button type="button" onclick="closeResultModal()">确定</button>
        <button type="button" onclick="newGame()">再来一局</button>
      </div>
    </div>
  </section>
  <script>
    var canvas = document.getElementById('board');
    var ctx = canvas.getContext('2d');
    var size = 15;
    var padding = 34;
    var step = (canvas.width - padding * 2) / (size - 1);
    var board = [];
    var current = 'black';
    var finished = false;
    var blackCount = 0;
    var whiteCount = 0;
    var mode = 'ai';
    var difficulty = 'easy';
    var aiThinking = false;
    var aiTimer = null;
    var difficulties = ['easy', 'normal', 'hard', 'master'];
    var difficultyNames = { easy: '简单', normal: '标准', hard: '困难', master: '大师' };

    function newGame() {
      closeResultModal();
      if (aiTimer) clearTimeout(aiTimer);
      aiThinking = false;
      board = [];
      for (var r = 0; r < size; r++) {
        board[r] = [];
        for (var c = 0; c < size; c++) board[r][c] = '';
      }
      current = 'black';
      finished = false;
      blackCount = 0;
      whiteCount = 0;
      updateControls();
      updatePanel(mode === 'ai' ? '轮到你落子。' : '黑棋先手，请落子。');
      draw();
    }

    function updateControls() {
      document.getElementById('modeBtn').innerHTML = mode === 'ai' ? '模式：人机' : '模式：双人';
      document.getElementById('difficultyBtn').innerHTML = '难度：' + difficultyNames[difficulty];
      document.getElementById('intro').innerHTML = mode === 'ai' ? '人机模式：你执黑先手，电脑执白后手。' : '双人模式：双方轮流点击交叉点落子。';
    }

    function toggleMode() {
      mode = mode === 'ai' ? 'duo' : 'ai';
      newGame();
    }

    function cycleDifficulty() {
      var index = difficulties.indexOf(difficulty);
      difficulty = difficulties[(index + 1) % difficulties.length];
      newGame();
    }

    function updatePanel(message) {
      document.getElementById('blackCount').innerHTML = String(blackCount);
      document.getElementById('whiteCount').innerHTML = String(whiteCount);
      document.getElementById('status').innerHTML = message;
    }

    function showResultModal(title, message) {
      document.getElementById('resultTitle').innerHTML = title;
      document.getElementById('resultMessage').innerHTML = message;
      document.getElementById('resultModal').className = 'result-modal show';
    }

    function closeResultModal() {
      document.getElementById('resultModal').className = 'result-modal';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#d6e8f4');
      gradient.addColorStop(.52, '#9fb9cf');
      gradient.addColorStop(1, '#6f8aa3');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(8, 25, 43, .56)';
      ctx.lineWidth = 1;
      for (var i = 0; i < size; i++) {
        var pos = padding + i * step;
        ctx.beginPath();
        ctx.moveTo(padding, pos);
        ctx.lineTo(canvas.width - padding, pos);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos, padding);
        ctx.lineTo(pos, canvas.height - padding);
        ctx.stroke();
      }

      drawStar(3, 3);
      drawStar(3, 11);
      drawStar(7, 7);
      drawStar(11, 3);
      drawStar(11, 11);

      for (var r = 0; r < size; r++) {
        for (var c = 0; c < size; c++) {
          if (board[r][c]) drawPiece(r, c, board[r][c]);
        }
      }
    }

    function drawStar(row, col) {
      ctx.beginPath();
      ctx.arc(padding + col * step, padding + row * step, 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(8, 25, 43, .70)';
      ctx.fill();
    }

    function drawPiece(row, col, color) {
      var x = padding + col * step;
      var y = padding + row * step;
      var radius = step * .38;
      var gradient = ctx.createRadialGradient(x - radius * .35, y - radius * .35, radius * .1, x, y, radius);
      if (color === 'black') {
        gradient.addColorStop(0, '#4b5565');
        gradient.addColorStop(.38, '#161b24');
        gradient.addColorStop(1, '#020407');
      } else {
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(.58, '#f1f5f9');
        gradient.addColorStop(1, '#cbd5e1');
      }
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.shadowColor = color === 'black' ? 'rgba(0,0,0,.42)' : 'rgba(4, 12, 24, .46)';
      ctx.shadowBlur = color === 'black' ? 8 : 12;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = color === 'black' ? 1.2 : 2.4;
      ctx.strokeStyle = color === 'black' ? 'rgba(255,255,255,.14)' : 'rgba(8, 25, 43, .62)';
      ctx.stroke();
    }

    function placePiece(row, col, source) {
      if (finished || aiThinking || board[row][col]) return false;
      if (mode === 'ai' && source !== 'ai' && current !== 'black') return false;
      board[row][col] = current;
      if (current === 'black') blackCount++;
      else whiteCount++;
      draw();
      if (hasWon(row, col, current)) {
        var winner = current === 'black' ? '黑棋' : '白棋';
        finished = true;
        updatePanel(winner + '获胜！点击新游戏再来一局。');
        showResultModal(winner + '获胜！', '点击“确定”关闭弹窗复盘，或点击“再来一局”重新开始。');
        return true;
      }
      if (blackCount + whiteCount === size * size) {
        finished = true;
        updatePanel('棋盘已满，平局。');
        showResultModal('平局！', '点击“确定”关闭弹窗复盘，或点击“再来一局”重新开始。');
        return true;
      }
      current = current === 'black' ? 'white' : 'black';
      if (mode === 'ai' && current === 'white') scheduleAiMove();
      else updatePanel(mode === 'ai' ? '轮到你落子。' : '轮到' + (current === 'black' ? '黑棋' : '白棋') + '落子。');
      return true;
    }

    function scheduleAiMove() {
      aiThinking = true;
      updatePanel('电脑思考中...');
      aiTimer = setTimeout(function() {
        var move = chooseAiMove();
        aiThinking = false;
        if (move) placePiece(move.row, move.col, 'ai');
      }, 250);
    }

    function chooseAiMove() {
      var moves = candidateMoves();
      if (moves.length === 0) return { row: 7, col: 7 };
      for (var i = 0; i < moves.length; i++) {
        if (isWinningMove(moves[i].row, moves[i].col, 'white')) return moves[i];
      }
      for (var j = 0; j < moves.length; j++) {
        if (isWinningMove(moves[j].row, moves[j].col, 'black')) return moves[j];
      }
      var best = null;
      var bestScore = -Infinity;
      for (var k = 0; k < moves.length; k++) {
        var move = moves[k];
        var score = scoreMove(move.row, move.col);
        if (difficulty === 'master') score -= futureRisk(move.row, move.col);
        if (score > bestScore) {
          bestScore = score;
          best = move;
        }
      }
      return best;
    }

    function candidateMoves() {
      if (blackCount + whiteCount === 0) return [{ row: 7, col: 7 }];
      var moves = [];
      for (var r = 0; r < size; r++) {
        for (var c = 0; c < size; c++) {
          if (!board[r][c] && hasNeighbor(r, c, difficulty === 'easy' ? 1 : 2)) moves.push({ row: r, col: c });
        }
      }
      return moves;
    }

    function hasNeighbor(row, col, distance) {
      for (var r = row - distance; r <= row + distance; r++) {
        for (var c = col - distance; c <= col + distance; c++) {
          if (r >= 0 && r < size && c >= 0 && c < size && board[r][c]) return true;
        }
      }
      return false;
    }

    function scoreMove(row, col) {
      var weights = {
        easy: { attack: 1, defense: 1.05, center: 8 },
        normal: { attack: 1.15, defense: 1.18, center: 6 },
        hard: { attack: 1.22, defense: 1.35, center: 4 },
        master: { attack: 1.34, defense: 1.56, center: 2 }
      }[difficulty];
      var attack = evaluatePoint(row, col, 'white');
      var defense = evaluatePoint(row, col, 'black');
      var center = 14 - (Math.abs(row - 7) + Math.abs(col - 7));
      var score = attack * weights.attack + defense * weights.defense + center * weights.center;
      if (difficulty === 'master') score += compoundThreatScore(row, col, 'white') * 1.15 + compoundThreatScore(row, col, 'black') * 1.45;
      return score;
    }

    function evaluatePoint(row, col, color) {
      var directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
      var score = 0;
      for (var i = 0; i < directions.length; i++) {
        var line = lineInfo(row, col, directions[i][0], directions[i][1], color);
        score += patternScore(line.count, line.open);
      }
      return score;
    }

    function lineInfo(row, col, dr, dc, color) {
      var forward = countLine(row, col, dr, dc, color);
      var backward = countLine(row, col, -dr, -dc, color);
      return { count: 1 + forward.count + backward.count, open: forward.open + backward.open };
    }

    function countLine(row, col, dr, dc, color) {
      var count = 0;
      var r = row + dr;
      var c = col + dc;
      while (r >= 0 && r < size && c >= 0 && c < size && board[r][c] === color) {
        count++;
        r += dr;
        c += dc;
      }
      return { count: count, open: r >= 0 && r < size && c >= 0 && c < size && !board[r][c] ? 1 : 0 };
    }

    function patternScore(count, open) {
      if (count >= 5) return 1000000;
      if (count === 4 && open === 2) return 120000;
      if (count === 4 && open === 1) return 50000;
      if (count === 3 && open === 2) return 12000;
      if (count === 3 && open === 1) return 3000;
      if (count === 2 && open === 2) return 800;
      if (count === 2 && open === 1) return 180;
      if (count === 1 && open === 2) return 40;
      return 8;
    }

    function compoundThreatScore(row, col, color) {
      var directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
      var liveFour = 0;
      var four = 0;
      var liveThree = 0;
      var three = 0;
      for (var i = 0; i < directions.length; i++) {
        var line = lineInfo(row, col, directions[i][0], directions[i][1], color);
        if (line.count >= 4 && line.open === 2) liveFour++;
        else if (line.count >= 4 && line.open === 1) four++;
        else if (line.count === 3 && line.open === 2) liveThree++;
        else if (line.count === 3 && line.open === 1) three++;
      }
      if (liveFour >= 1 && liveThree >= 1) return 180000;
      if (four >= 2 || liveFour >= 2) return 160000;
      if (liveThree >= 2) return 90000;
      if (liveThree >= 1 && three >= 1) return 42000;
      return liveFour * 60000 + four * 22000 + liveThree * 12000 + three * 2400;
    }

    function futureRisk(row, col) {
      board[row][col] = 'white';
      var moves = candidateMoves();
      var risk = 0;
      for (var i = 0; i < moves.length; i++) {
        risk = Math.max(risk, evaluatePoint(moves[i].row, moves[i].col, 'black') + compoundThreatScore(moves[i].row, moves[i].col, 'black'));
      }
      board[row][col] = '';
      return risk * .62;
    }

    function isWinningMove(row, col, color) {
      board[row][col] = color;
      var won = hasWon(row, col, color);
      board[row][col] = '';
      return won;
    }

    function hasWon(row, col, color) {
      var directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (var i = 0; i < directions.length; i++) {
        var total = 1 + countDirection(row, col, directions[i][0], directions[i][1], color) + countDirection(row, col, -directions[i][0], -directions[i][1], color);
        if (total >= 5) return true;
      }
      return false;
    }

    function countDirection(row, col, dr, dc, color) {
      var count = 0;
      var r = row + dr;
      var c = col + dc;
      while (r >= 0 && r < size && c >= 0 && c < size && board[r][c] === color) {
        count++;
        r += dr;
        c += dc;
      }
      return count;
    }

    function canvasPoint(event) {
      var rect = canvas.getBoundingClientRect();
      var touch = event.touches && event.touches[0] ? event.touches[0] : event;
      return {
        x: (touch.clientX - rect.left) * canvas.width / rect.width,
        y: (touch.clientY - rect.top) * canvas.height / rect.height
      };
    }

    function handleMove(event) {
      if (event.preventDefault) event.preventDefault();
      if (finished || aiThinking) return;
      var point = canvasPoint(event);
      var col = Math.round((point.x - padding) / step);
      var row = Math.round((point.y - padding) / step);
      if (row < 0 || row >= size || col < 0 || col >= size) return;
      var x = padding + col * step;
      var y = padding + row * step;
      if (Math.hypot(point.x - x, point.y - y) > step * .45) return;
      placePiece(row, col, 'player');
    }

    canvas.addEventListener('click', handleMove);
    canvas.addEventListener('touchstart', handleMove, { passive: false });

    newGame();
  </script>
</body>
</html>
