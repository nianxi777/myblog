}
.game-home::before {
  content: "";
  position: absolute;

  pointer-events: none;
  background-image:

  text-shadow: 0 0 24px rgba(48, 169, 222, .55);
}
.game-home-intro p {
  margin: 0;
  color: #a9c7dc;
  font-size: 16px;
}
.game-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.game-card {
  position: relative;
  display: flex;
  min-height: 150px;
  align-items: center;
  justify-content: center;
  padding: 26px 20px;
  overflow: hidden;
  border: 1px solid rgba(87, 203, 255, .28);

  text-decoration: none !important;
  color: #fff !important;
  background: linear-gradient(145deg, rgba(16, 35, 63, .88), rgba(24, 32, 68, .66));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 18px 42px rgba(0, 0, 0, .28);
  backdrop-filter: blur(10px);
  transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
}
.game-card::before {
  content: "";
  position: absolute;
  inset: -40% -20%;
  background: linear-gradient(120deg, transparent 35%, rgba(87, 203, 255, .22), transparent 65%);
  transform: translateX(-60%) rotate(12deg);
  transition: transform .45s ease;
}
.game-card:hover {
  transform: translateY(-6px);
  border-color: rgba(87, 203, 255, .72);
  box-shadow: 0 0 28px rgba(48, 169, 222, .28), 0 22px 48px rgba(0, 0, 0, .34);
}
.game-card:hover::before {
  transform: translateX(60%) rotate(12deg);
}
.game-card h3 {
  position: relative;
  z-index: 1;
  margin: 0;
  color: #f7fbff;
  font-size: clamp(24px, 3vw, 32px);
  letter-spacing: .08em;
}
@media (max-width: 900px) {
  .game-home {

    padding: 24px;

}
