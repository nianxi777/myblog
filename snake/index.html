<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>贪吃蛇 - 溪_</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #3c4858;
      background: linear-gradient(135deg, #eef2f7, #dbe6f1);
    }
    .game-wrap {
      width: min(96vw, 760px);
      max-height: calc(100vh - 24px);
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 230px;
      gap: 18px;
      align-items: center;
    }
    .board-panel { min-width: 0; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 18px;
      background: #2f4154;
      box-shadow: 0 18px 40px rgba(31, 49, 68, .18);
      touch-action: none;
    }
    .side-panel { display: flex; flex-direction: column; gap: 12px; }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vh, 46px);
      line-height: 1;
      color: #2f4154;
    }
    .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .score-box {
      padding: 7px 9px;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      background: #2f4154;
    }
    .score-box span { display: block; font-size: 12px; opacity: .85; }
    .score-box strong { font-size: 20px; }
    p { margin: 0; line-height: 1.45; color: #2f4154; font-size: 14px; }
    button, .home-link {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      background: #2f4154;
      text-decoration: none;
      text-align: center;
      font-family: inherit;
      transition: background .2s ease, transform .2s ease;
    }
    button:hover, .home-link:hover { background: #30a9de; transform: translateY(-1px); }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      justify-content: center;
      gap: 6px;
    }
    .controls button { height: 38px; padding: 0; font-size: 20px; }
    .controls .up { grid-column: 2; }
    .controls .left { grid-column: 1; }
    .controls .down { grid-column: 2; }
    .controls .right { grid-column: 3; }
    .status { min-height: 44px; margin: 0; font-weight: 700; color: #2f4154; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    @media (max-width: 700px) {
      body { padding: 10px; }
      .game-wrap { width: min(96vw, 430px); display: block; }
      .side-panel { gap: 8px; margin-top: 10px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .scores { width: 150px; }
      .score-box { padding: 5px 8px; }
      p { font-size: 13px; }
      .controls { margin: 6px 0; grid-template-columns: repeat(3, 52px); }
      .status { min-height: 22px; text-align: center; }
      .actions { flex-direction: row; justify-content: center; }
    }
    @media (max-height: 700px) {
      body { padding: 8px; }
      .game-wrap { width: min(96vw, 700px); grid-template-columns: minmax(300px, 1fr) 210px; gap: 12px; }
      h1 { font-size: 34px; }
      .side-panel { gap: 8px; }
      p { font-size: 12px; }
      .actions { display: none; }
    }
    @media (max-width: 700px) and (max-height: 700px) {
      .game-wrap { width: min(92vw, 380px); display: block; }
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <section class="board-panel">
      <canvas id="board" width="400" height="400" aria-label="贪吃蛇游戏区域"></canvas>
    </section>
    <aside class="side-panel">
      <section class="topbar">
        <h1>贪吃蛇</h1>
        <div class="scores">
          <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
          <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
        </div>
      </section>
      <p>用方向键、WASD、滑动或按钮控制方向，吃到蓝色食物会变长。</p>
      <button type="button" onclick="newGame()">新游戏</button>
      <section class="controls" aria-label="方向控制">
        <button type="button" class="up" onclick="setDirection('up')">↑</button>
        <button type="button" class="left" onclick="setDirection('left')">←</button>
        <button type="button" class="down" onclick="setDirection('down')">↓</button>
        <button type="button" class="right" onclick="setDirection('right')">→</button>
      </section>
      <p class="status" id="status">游戏加载中...</p>
      <section class="actions">
        <a class="home-link" href="/myblog/">返回首页</a>
        <button type="button" onclick="togglePause()" id="pause">暂停</button>
      </section>
    </aside>
  </main>
  <script>
    var canvas = document.getElementById('board');
    var ctx = canvas.getContext('2d');
    var grid = 20;
    var cell = canvas.width / grid;
    var snake = [];
    var food = { x: 0, y: 0 };
    var direction = 'right';
    var nextDirection = 'right';
    var score = 0;
    var best = 0;
    var timer = null;
    var paused = false;
    var over = false;
    var startX = 0;
    var startY = 0;

    function getBest() {
      try { return Number(window.localStorage.getItem('myblog-snake-best') || 0); }
      catch (e) { return 0; }
    }

    function saveBest(value) {
      try { window.localStorage.setItem('myblog-snake-best', String(value)); }
      catch (e) {}
    }

    function newGame() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      direction = 'right';
      nextDirection = 'right';
      score = 0;
      best = getBest();
      paused = false;
      over = false;
      document.getElementById('pause').innerHTML = '暂停';
      document.getElementById('status').innerHTML = '游戏开始，吃到食物会变长。';
      placeFood();
      draw();
      if (timer) clearInterval(timer);
      timer = setInterval(tick, 135);
    }

    function placeFood() {
      var ok = false;
      while (!ok) {
        food.x = Math.floor(Math.random() * grid);
        food.y = Math.floor(Math.random() * grid);
        ok = true;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === food.x && snake[i].y === food.y) ok = false;
        }
      }
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
    }

    function draw() {
      ctx.fillStyle = '#2f4154';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,.06)';
      for (var i = 0; i <= grid; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cell, 0);
        ctx.lineTo(i * cell, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * cell);
        ctx.lineTo(canvas.width, i * cell);
        ctx.stroke();
      }
      drawCell(food.x, food.y, '#30a9de');
      for (var s = snake.length - 1; s >= 0; s--) {
        drawCell(snake[s].x, snake[s].y, s === 0 ? '#f8fafc' : '#a7b4c4');
      }
      document.getElementById('score').innerHTML = String(score);
      if (score > best) {
        best = score;
        saveBest(best);
      }
      document.getElementById('best').innerHTML = String(best);
    }

    function tick() {
      if (paused || over) return;
      direction = nextDirection;
      var head = { x: snake[0].x, y: snake[0].y };
      if (direction === 'left') head.x--;
      if (direction === 'right') head.x++;
      if (direction === 'up') head.y--;
      if (direction === 'down') head.y++;

      if (head.x < 0 || head.x >= grid || head.y < 0 || head.y >= grid || hitSnake(head)) {
        over = true;
        clearInterval(timer);
        document.getElementById('status').innerHTML = '游戏结束，点击新游戏再来一局。';
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function hitSnake(pos) {
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === pos.x && snake[i].y === pos.y) return true;
      }
      return false;
    }

    function setDirection(dir) {
      if (dir === 'left' && direction !== 'right') nextDirection = dir;
      if (dir === 'right' && direction !== 'left') nextDirection = dir;
      if (dir === 'up' && direction !== 'down') nextDirection = dir;
      if (dir === 'down' && direction !== 'up') nextDirection = dir;
    }

    function togglePause() {
      if (over) return;
      paused = !paused;
      document.getElementById('pause').innerHTML = paused ? '继续' : '暂停';
      document.getElementById('status').innerHTML = paused ? '已暂停。' : '继续游戏。';
    }

    document.onkeydown = function(event) {
      event = event || window.event;
      var key = event.key || event.keyCode;
      var dir = null;
      if (key === 'ArrowLeft' || key === 'a' || key === 'A' || key === 37) dir = 'left';
      if (key === 'ArrowRight' || key === 'd' || key === 'D' || key === 39) dir = 'right';
      if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === 38) dir = 'up';
      if (key === 'ArrowDown' || key === 's' || key === 'S' || key === 40) dir = 'down';
      if (key === ' ' || key === 32) {
        if (event.preventDefault) event.preventDefault();
        togglePause();
        return false;
      }
      if (dir) {
        if (event.preventDefault) event.preventDefault();
        setDirection(dir);
        return false;
      }
    };

    canvas.ontouchstart = function(event) {
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    };

    canvas.ontouchend = function(event) {
      var touch = event.changedTouches[0];
      var dx = touch.clientX - startX;
      var dy = touch.clientY - startY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
      if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 'right' : 'left');
      else setDirection(dy > 0 ? 'down' : 'up');
    };

    newGame();
  </script>
</body>
</html>
