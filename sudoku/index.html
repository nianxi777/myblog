  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(104, 213, 255, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(104, 213, 255, .07) 1px, transparent 1px); background-size: 42px 42px; mask-image: radial-gradient(circle, rgba(0,0,0,.86), transparent 78%); }
    .game-wrap { position: relative; z-index: 1; width: min(96vw, 860px); max-height: calc(100vh - 28px); display: grid; grid-template-columns: minmax(320px, 1fr) 244px; gap: 20px; align-items: center; }
    .board-panel { min-width: 0; padding: clamp(10px, 1.8vw, 16px); border: 1px solid rgba(104, 213, 255, .24); border-radius: 26px; background: linear-gradient(145deg, rgba(13, 27, 47, .70), rgba(8, 16, 31, .54)); box-shadow: 0 0 36px rgba(138, 124, 255, .16), 0 28px 70px rgba(0,0,0,.32); backdrop-filter: blur(12px); }
    .board { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); aspect-ratio: 1; border: 3px solid rgba(104, 213, 255, .58); border-radius: 18px; overflow: hidden; background: #07111f; box-shadow: inset 0 0 28px rgba(48, 213, 255, .10), 0 0 30px rgba(138, 124, 255, .18); touch-action: manipulation; user-select: none; }
    .cell { position: relative; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; background: rgba(235, 248, 255, .94); color: #07111f; box-shadow: inset 0 0 0 1px rgba(7, 17, 31, .26); font-size: clamp(20px, 6vw, 34px); font-weight: 900; cursor: pointer; transition: background .14s ease, color .14s ease, box-shadow .14s ease, transform .14s ease; }
    .cell:hover { box-shadow: inset 0 0 0 2px rgba(48, 213, 255, .58); }
    .cell.block-right { box-shadow: inset -3px 0 0 #07111f, inset 0 0 0 1px rgba(7, 17, 31, .26); }
    .cell.block-bottom { box-shadow: inset 0 -3px 0 #07111f, inset 0 0 0 1px rgba(7, 17, 31, .26); }
    .cell.block-right.block-bottom { box-shadow: inset -3px 0 0 #07111f, inset 0 -3px 0 #07111f, inset 0 0 0 1px rgba(7, 17, 31, .26); }
    .cell.fixed { color: #eaf8ff; background: linear-gradient(135deg, #0e223a, #162c4b); }
    .cell.selected { color: #07111f; background: #30d5ff; box-shadow: inset 0 0 0 2px #f7fbff, 0 0 16px rgba(48, 213, 255, .44); transform: scale(.98); }
    .cell.related { color: #eaf8ff; background: rgba(48, 169, 222, .40); }
    .cell.error { color: #fff; background: linear-gradient(135deg, #ff3d71, #b42335); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 0 16px rgba(255,61,113,.35); }
    .cell.hint { color: #fff; background: linear-gradient(135deg, #8a7cff, #30a9de); box-shadow: 0 0 16px rgba(138,124,255,.38); }
    .notes { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 3px; color: #061425; font-size: clamp(11px, 3vw, 16px); font-weight: 900; line-height: 1; text-shadow: none; }
    .cell.related .notes { color: #eef8ff; text-shadow: 0 0 8px rgba(48, 213, 255, .36); }
    .cell.selected .notes { color: #061425; text-shadow: none; }
    .note { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
    .side-panel { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid rgba(104, 213, 255, .24); border-radius: 24px; background: rgba(13, 27, 47, .78); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 20px 50px rgba(0,0,0,.28); backdrop-filter: blur(12px); }
    .topbar { display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; font-size: clamp(38px, 8vh, 52px); line-height: 1; color: #eef8ff; letter-spacing: .06em; text-shadow: 0 0 24px rgba(138, 124, 255, .52); }
    .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .score-box { padding: 9px 10px; border: 1px solid rgba(104, 213, 255, .28); border-radius: 14px; text-align: center; color: #eef8ff; background: linear-gradient(145deg, rgba(138, 124, 255, .16), rgba(48, 169, 222, .12)); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
    .score-box span { display: block; font-size: 12px; color: #a9c7dc; }
    .score-box strong { font-size: 22px; color: #fff; }
    p { margin: 0; line-height: 1.55; color: #a9c7dc; font-size: 14px; }
    button, .home-link { border: 1px solid rgba(104, 213, 255, .34); border-radius: 12px; padding: 9px 13px; cursor: pointer; font-weight: 800; color: #f7fbff; background: linear-gradient(135deg, rgba(138, 124, 255, .72), rgba(48, 169, 222, .70)); text-decoration: none; text-align: center; font-family: inherit; box-shadow: 0 10px 24px rgba(138, 124, 255, .16); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, filter .18s ease; }
    button:hover, .home-link:hover { transform: translateY(-2px); border-color: rgba(104, 213, 255, .72); box-shadow: 0 0 24px rgba(138, 124, 255, .30); filter: brightness(1.08); }
    button:active, .home-link:active { transform: translateY(0); }
    .puzzle-picker { display: grid; gap: 6px; }
    .puzzle-picker label { color: #d8edff; font-size: 13px; font-weight: 800; }
    .puzzle-picker select { width: 100%; border: 1px solid rgba(104, 213, 255, .28); border-radius: 12px; padding: 9px 12px; color: #eef8ff; background: rgba(7, 17, 31, .82); font-weight: 800; font-family: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
    .numbers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .numbers button { height: 40px; padding: 0; font-size: 18px; }
    .status { min-height: 44px; margin: 0; font-weight: 800; line-height: 1.45; color: #d8edff; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 760px) {
      body { padding: 10px; align-items: flex-start; overflow: auto; }
      .game-wrap { width: min(96vw, 430px); max-height: none; display: block; }
      .board-panel { padding: 10px; }
      .side-panel { gap: 9px; margin-top: 10px; padding: 12px; }
      .topbar { flex-direction: row; justify-content: space-between; align-items: center; gap: 10px; }
      .scores { width: 156px; }
      .score-box { padding: 6px 8px; }
      p { font-size: 13px; }
      .numbers { grid-template-columns: repeat(5, 1fr); }
      .numbers button { height: 36px; }
      .status { min-height: 22px; text-align: center; }
      .actions { grid-template-columns: 1fr 1fr; }
    }
    @media (max-height: 700px) and (min-width: 761px) {
      body { padding: 8px; }
      .game-wrap { width: min(96vw, 780px); grid-template-columns: minmax(300px, 1fr) 216px; gap: 12px; }

      .side-panel { gap: 8px; padding: 12px; }
      p { font-size: 12px; }
      .numbers button { height: 32px; }
      .actions { display: none; }
    }

    var board = [];
    var notes = [];
    var fixed = [];
    var solution = '';
    var currentDifficulty = 'easy';
    var currentPuzzleIndex = 0;
    var selected = -1;
    var mistakes = 0;
    var errors = [];
    var seconds = 0;
    var timer = null;
    var finished = false;
    var pressTimer = null;
    var longPressed = false;

    function pad(value) {
      return value < 10 ? '0' + value : String(value);
    }

    function updateTime() {
      seconds++;
      document.getElementById('time').innerHTML = pad(Math.floor(seconds / 60)) + ':' + pad(seconds % 60);
    }

    function difficultyName(level) {
      if (level === 'medium') return '中等';
      if (level === 'hard') return '困难';
      if (level === 'veryHard') return '极难';
      return '简单';
    }

    function getCompleted() {
      try { return JSON.parse(window.localStorage.getItem('myblog-sudoku-completed') || '{}'); }
      catch (e) { return {}; }
    }

    function saveCompleted(completed) {
      try { window.localStorage.setItem('myblog-sudoku-completed', JSON.stringify(completed)); }
      catch (e) {}
    }

    function completedKey(level, index) {
      return level + '-' + index;
    }

    function renderPuzzleSelect() {
      var select = document.getElementById('puzzleSelect');
      var completed = getCompleted();
      var list = puzzles[currentDifficulty];
      var html = '';
      for (var i = 0; i < list.length; i++) {
        var label = (completed[completedKey(currentDifficulty, i)] ? '✓ ' : '') + '第 ' + (i + 1) + ' 题';
        html += '<option value="' + i + '"' + (i === currentPuzzleIndex ? ' selected' : '') + '>' + label + '</option>';
      }
      select.innerHTML = html;
    }

    function markCompleted() {
      var completed = getCompleted();
      completed[completedKey(currentDifficulty, currentPuzzleIndex)] = true;
      saveCompleted(completed);
      renderPuzzleSelect();
    }

    function changePuzzle() {
      currentPuzzleIndex = Number(document.getElementById('puzzleSelect').value || 0);
      newGame();
    }

    function cycleDifficulty() {
      if (currentDifficulty === 'easy') currentDifficulty = 'medium';
      else if (currentDifficulty === 'medium') currentDifficulty = 'hard';
      else if (currentDifficulty === 'hard') currentDifficulty = 'veryHard';
      else currentDifficulty = 'easy';
      currentPuzzleIndex = 0;
      document.getElementById('difficultyBtn').innerHTML = '难度：' + difficultyName(currentDifficulty);
      renderPuzzleSelect();
      newGame();
    }

    function newGame() {
      var list = puzzles[currentDifficulty];
      if (currentPuzzleIndex >= list.length) currentPuzzleIndex = 0;
      var item = list[currentPuzzleIndex];
      board = [];
      notes = [];
      fixed = [];
      solution = item.solution;
      selected = -1;
      mistakes = 0;
      errors = [];
      seconds = 0;
      finished = false;
      for (var i = 0; i < 81; i++) {
        board[i] = item.puzzle.charAt(i) === '0' ? '' : item.puzzle.charAt(i);
        notes[i] = [];
        fixed[i] = item.puzzle.charAt(i) !== '0';
      }
      cancelNumberPress();
      document.getElementById('time').innerHTML = '00:00';
      document.getElementById('mistakes').innerHTML = '0';
      document.getElementById('status').innerHTML = difficultyName(currentDifficulty) + ' · 第 ' + (currentPuzzleIndex + 1) + ' 题，选择空格开始填写。';
      renderPuzzleSelect();
      if (timer) clearInterval(timer);
      timer = setInterval(updateTime, 1000);
      draw();
    }

    function draw() {
      var html = '';
      for (var i = 0; i < 81; i++) {
        var cls = 'cell';
        if (i % 9 === 2 || i % 9 === 5) cls += ' block-right';
        if (Math.floor(i / 9) === 2 || Math.floor(i / 9) === 5) cls += ' block-bottom';
        if (fixed[i]) cls += ' fixed';
        if (i === selected) cls += ' selected';
        else if (selected >= 0 && related(i, selected)) cls += ' related';
        if (errors[i]) cls += ' error';
        html += '<div class="' + cls + '" onclick="selectCell(' + i + ')">' + cellContent(i) + '</div>';
      }
      document.getElementById('board').innerHTML = html;
    }

    function cellContent(index) {
      if (board[index]) return board[index];
      if (!notes[index] || notes[index].length === 0) return '';
      var html = '<div class="notes">';
      for (var n = 1; n <= 9; n++) {
        html += '<span class="note">' + (notes[index].indexOf(n) >= 0 ? n : '') + '</span>';
      }
      return html + '</div>';
    }

    function related(a, b) {
      var ar = Math.floor(a / 9);
      var ac = a % 9;
      var br = Math.floor(b / 9);
      var bc = b % 9;
      return ar === br || ac === bc || (Math.floor(ar / 3) === Math.floor(br / 3) && Math.floor(ac / 3) === Math.floor(bc / 3));
    }

    function selectCell(index) {
      if (finished) return;
      selected = index;
      draw();
    }

    function startNumberPress(num) {
      cancelNumberPress();
      longPressed = false;
      pressTimer = setTimeout(function() {
        longPressed = true;
        putNumber(num);
      }, 520);
    }

    function endNumberPress() {
      if (pressTimer) clearTimeout(pressTimer);
      pressTimer = null;
    }

    function cancelNumberPress() {
      if (pressTimer) clearTimeout(pressTimer);
      pressTimer = null;
    }

    function numberClick(num) {
      if (longPressed) {
        longPressed = false;
        return;
      }
      toggleNoteNumber(num);
    }

    function toggleNoteNumber(num) {
      if (selected < 0 || fixed[selected] || finished || board[selected]) return;
      toggleNote(selected, num);
      errors = [];
      document.getElementById('mistakes').innerHTML = '0';
      document.getElementById('status').innerHTML = '已更新当前格子的候选数，长按数字可填入答案。';
      draw();
    }

    function putNumber(num) {
      if (selected < 0 || fixed[selected] || finished) return;
      board[selected] = String(num);
      notes[selected] = [];
      errors = [];
      document.getElementById('mistakes').innerHTML = '0';
      document.getElementById('status').innerHTML = '已填入答案，完成后点击验证。';
      draw();
    }

    function toggleNote(index, num) {
      if (!notes[index]) notes[index] = [];
      var pos = notes[index].indexOf(num);
      if (pos >= 0) notes[index].splice(pos, 1);
      else notes[index].push(num);
      notes[index].sort(function(a, b) { return a - b; });
    }

    function clearCell() {
      if (selected < 0 || fixed[selected] || finished) return;
      board[selected] = '';
      notes[selected] = [];
      errors = [];
      document.getElementById('mistakes').innerHTML = '0';
      document.getElementById('status').innerHTML = '已清除当前格子和候选数。';
      draw();
    }

    function verifyBoard() {
      if (finished) return;
      errors = [];
      mistakes = 0;
      for (var i = 0; i < 81; i++) {
        if (!board[i]) {
          document.getElementById('status').innerHTML = '还有空格没有填写，填完后再验证。';
          document.getElementById('mistakes').innerHTML = '0';
          draw();
          return;
        }
        if (board[i] !== solution.charAt(i)) {
          errors[i] = true;
          mistakes++;
        }
      }
      document.getElementById('mistakes').innerHTML = String(mistakes);
      if (mistakes === 0) {
        finished = true;
        clearInterval(timer);
        markCompleted();
        document.getElementById('status').innerHTML = '全部正确！用时 ' + document.getElementById('time').innerHTML + '。';
      } else {
        document.getElementById('status').innerHTML = '有 ' + mistakes + ' 个错误，红色格子需要修改。';
      }
      draw();
    }

    document.onkeydown = function(event) {
      event = event || window.event;
      var key = event.key || event.keyCode;
      if (key >= '1' && key <= '9') {
        if (event.shiftKey) putNumber(Number(key));
        else toggleNoteNumber(Number(key));
        return false;
      }
      if (key >= 49 && key <= 57) {
        if (event.shiftKey) putNumber(key - 48);
        else toggleNoteNumber(key - 48);
        return false;
      }
      if (key === 'Backspace' || key === 'Delete' || key === 8 || key === 46 || key === '0' || key === 48) {
        clearCell();
        return false;
      }
    };

    newGame();
  </script>
