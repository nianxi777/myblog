<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>数独 - 溪_</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #3c4858;
      background: linear-gradient(135deg, #eef2f7, #dbe6f1);
    }
    .game-wrap {
      width: min(96vw, 820px);
      max-height: calc(100vh - 24px);
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 230px;
      gap: 18px;
      align-items: center;
    }
    .board-panel { min-width: 0; }
    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      aspect-ratio: 1;
      border: 4px solid #2f4154;
      border-radius: 16px;
      overflow: hidden;
      background: #2f4154;
      box-shadow: 0 18px 40px rgba(31, 49, 68, .18);
      touch-action: manipulation;
      user-select: none;
    }
    .cell {
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7fbff;
      color: #1f3144;
      box-shadow: inset 0 0 0 1px rgba(47, 65, 84, .28);
      font-size: clamp(20px, 6vw, 34px);
      font-weight: 800;
      cursor: pointer;
    }
    .cell.block-right { box-shadow: inset -3px 0 0 #2f4154, inset 0 0 0 1px rgba(47, 65, 84, .28); }
    .cell.block-bottom { box-shadow: inset 0 -3px 0 #2f4154, inset 0 0 0 1px rgba(47, 65, 84, .28); }
    .cell.block-right.block-bottom { box-shadow: inset -3px 0 0 #2f4154, inset 0 -3px 0 #2f4154, inset 0 0 0 1px rgba(47, 65, 84, .28); }
    .cell.fixed { color: #fff; background: #1f3144; }
    .cell.selected { background: #f6c85f; color: #1f3144; }
    .cell.related { background: #d8e6f3; color: #1f3144; }
    .cell.error { color: #fff; background: #b42335; }
    .cell.hint { color: #fff; background: #0b6f9f; }
    .side-panel { display: flex; flex-direction: column; gap: 12px; }
    .topbar { display: flex; flex-direction: column; gap: 10px; }
    h1 {
      margin: 0;
      font-size: clamp(38px, 8vh, 50px);
      line-height: 1;
      color: #2f4154;
    }
    .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .score-box {
      padding: 7px 9px;
      border-radius: 10px;
      text-align: center;
      color: #fff;
      background: #2f4154;
    }
    .score-box span { display: block; font-size: 12px; opacity: .85; }
    .score-box strong { font-size: 20px; }
    p { margin: 0; line-height: 1.45; color: #2f4154; font-size: 14px; }
    button, .home-link {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      background: #2f4154;
      text-decoration: none;
      text-align: center;
      font-family: inherit;
      transition: background .2s ease, transform .2s ease;
    }
    button:hover, .home-link:hover { background: #30a9de; transform: translateY(-1px); }
    .numbers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .numbers button { height: 38px; padding: 0; font-size: 18px; }
    .status { min-height: 44px; margin: 0; font-weight: 700; color: #2f4154; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 760px) {
      body { padding: 10px; }
      .game-wrap { width: min(96vw, 430px); display: block; }
      .side-panel { gap: 8px; margin-top: 10px; }
      .topbar { flex-direction: row; justify-content: space-between; align-items: center; gap: 10px; }
      .scores { width: 150px; }
      .score-box { padding: 5px 8px; }
      p { font-size: 13px; }
      .numbers { grid-template-columns: repeat(5, 1fr); }
      .numbers button { height: 34px; }
      .status { min-height: 22px; text-align: center; }
      .actions { grid-template-columns: 1fr 1fr; }
    }
    @media (max-height: 700px) {
      body { padding: 8px; }
      .game-wrap { width: min(96vw, 760px); grid-template-columns: minmax(300px, 1fr) 210px; gap: 12px; }
      h1 { font-size: 34px; }
      .side-panel { gap: 8px; }
      p { font-size: 12px; }
      .numbers button { height: 32px; }
      .actions { display: none; }
    }
    @media (max-width: 760px) and (max-height: 700px) {
      .game-wrap { width: min(92vw, 380px); display: block; }
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <section class="board-panel">
      <div class="board" id="board" aria-label="数独游戏区域"></div>
    </section>
    <aside class="side-panel">
      <section class="topbar">
        <h1>数独</h1>
        <div class="scores">
          <div class="score-box"><span>用时</span><strong id="time">00:00</strong></div>
          <div class="score-box"><span>错误</span><strong id="mistakes">0</strong></div>
        </div>
      </section>
      <p>选择空格后输入数字，全部填完后点击验证。</p>
      <section class="numbers" aria-label="数字输入">
        <button type="button" onclick="putNumber(1)">1</button>
        <button type="button" onclick="putNumber(2)">2</button>
        <button type="button" onclick="putNumber(3)">3</button>
        <button type="button" onclick="putNumber(4)">4</button>
        <button type="button" onclick="putNumber(5)">5</button>
        <button type="button" onclick="putNumber(6)">6</button>
        <button type="button" onclick="putNumber(7)">7</button>
        <button type="button" onclick="putNumber(8)">8</button>
        <button type="button" onclick="putNumber(9)">9</button>
        <button type="button" onclick="clearCell()">清除</button>
      </section>
      <p class="status" id="status">游戏加载中...</p>
      <section class="actions">
        <button type="button" onclick="verifyBoard()">验证</button>
        <button type="button" onclick="newGame()">新游戏</button>
        <button type="button" id="difficultyBtn" onclick="cycleDifficulty()">难度：简单</button>
        <a class="home-link" href="/myblog/">返回首页</a>
      </section>
    </aside>
  </main>
  <script>
    var puzzles = {
      easy: [
        {
          puzzle: '530070000600195000098000060800060003400803001700020006060000280000419005000080079',
          solution: '534678912672195348198342567859761423426853791713924856961537284287419635345286179'
        },
        {
          puzzle: '640080000700216000019000070900070004500904002800030007070000390000521006000090081',
          solution: '645789123783216459219453678961872534537964812824135967172648395398521746456397281'
        },
        {
          puzzle: '750090000800327000021000080100080005600105003900040008080000410000632007000010092',
          solution: '756891234894327561321564789172983645648175923935246178283759416419632857567418392'
        },
        {
          puzzle: '860010000900438000032000090200090006700206004100050009090000520000743008000020013',
          solution: '867912345915438672432675891283194756759286134146357289394861527521743968678529413'
        },
        {
          puzzle: '970020000100549000043000010300010007800307005200060001010000630000854009000030024',
          solution: '978123456126549783543786912394215867861397245257468391415972638632854179789631524'
        },
        {
          puzzle: '570030000400915000012000040200040007600207009300080004040000820000691005000020031',
          solution: '576432198438915762912768543251349687684257319397186254149573826823691475765824931'
        }
      ],
      medium: [
        {
          puzzle: '000260701680070090190004500820100040004602900050003028009300074040050036703018000',
          solution: '435269781682571493197834562826195347374682915951743628519326874248957136763418259'
        },
        {
          puzzle: '000370802790080010210005600930200050005703100060004039001400085050060047804029000',
          solution: '546371892793682514218945673937216458485793126162854739621437985359168247874529361'
        },
        {
          puzzle: '000480903810090020320006700140300060006804200070005041002500096060070058905031000',
          solution: '657482913814793625329156784148327569596814237273965841732548196461279358985631472'
        },
        {
          puzzle: '000590104920010030430007800250400070007905300080006052003600017070080069106042000',
          solution: '768593124925814736431267895259438671617925348384176952843659217572381469196742583'
        },
        {
          puzzle: '000610205130020040540008900360500080008106400090007063004700028080090071207053000',
          solution: '879614235136925847542378916361549782728136459495287163954761328683492571217853694'
        },
        {
          puzzle: '000840309420030010910006500280900060006408100050007082001700036060050074307092000',
          solution: '675841329428539617913276548284915763736428195159367482591784236862153974347692851'
        }
      ],
      hard: [
        {
          puzzle: '000000010400000000020000000000050407008000300001090000300400200050100000000806000',
          solution: '693784512487512936125963874932651487568247391741398625319475268856129743274836159'
        },
        {
          puzzle: '000000020500000000030000000000060508009000400002010000400500300060200000000907000',
          solution: '714895623598623147236174985143762598679358412852419736421586379967231854385947261'
        },
        {
          puzzle: '000000030600000000040000000000070609001000500003020000500600400070300000000108000',
          solution: '825916734619734258347285196254873619781469523963521847532697481178342965496158372'
        },
        {
          puzzle: '000000040700000000050000000000080701002000600004030000600700500080400000000209000',
          solution: '936127845721845369458396217365984721892571634174632958643718592289453176517269483'
        },
        {
          puzzle: '000000050800000000060000000000090802003000700005040000700800600090500000000301000',
          solution: '147238956832956471569417328476195832913682745285743169754829613391564287628371594'
        },
        {
          puzzle: '000000090600000000080000000000050603002000700009010000700600800050900000000204000',
          solution: '417326598623598174985147236178459623542863719369712485791635842254981367836274951'
        }
      ]
    };
    var board = [];
    var fixed = [];
    var solution = '';
    var currentDifficulty = 'easy';
    var selected = -1;
    var mistakes = 0;
    var errors = [];
    var seconds = 0;
    var timer = null;
    var finished = false;

    function pad(value) {
      return value < 10 ? '0' + value : String(value);
    }

    function updateTime() {
      seconds++;
      document.getElementById('time').innerHTML = pad(Math.floor(seconds / 60)) + ':' + pad(seconds % 60);
    }

    function difficultyName(level) {
      if (level === 'medium') return '中等';
      if (level === 'hard') return '困难';
      return '简单';
    }

    function cycleDifficulty() {
      if (currentDifficulty === 'easy') currentDifficulty = 'medium';
      else if (currentDifficulty === 'medium') currentDifficulty = 'hard';
      else currentDifficulty = 'easy';
      document.getElementById('difficultyBtn').innerHTML = '难度：' + difficultyName(currentDifficulty);
      newGame();
    }

    function newGame() {
      var list = puzzles[currentDifficulty];
      var item = list[Math.floor(Math.random() * list.length)];
      board = [];
      fixed = [];
      solution = item.solution;
      selected = -1;
      mistakes = 0;
      errors = [];
      seconds = 0;
      finished = false;
      for (var i = 0; i < 81; i++) {
        board[i] = item.puzzle.charAt(i) === '0' ? '' : item.puzzle.charAt(i);
        fixed[i] = item.puzzle.charAt(i) !== '0';
      }
      document.getElementById('time').innerHTML = '00:00';
      document.getElementById('mistakes').innerHTML = '0';
      document.getElementById('status').innerHTML = '选择空格，开始填写数字。';
      if (timer) clearInterval(timer);
      timer = setInterval(updateTime, 1000);
      draw();
    }

    function draw() {
      var html = '';
      for (var i = 0; i < 81; i++) {
        var cls = 'cell';
        if (i % 9 === 2 || i % 9 === 5) cls += ' block-right';
        if (Math.floor(i / 9) === 2 || Math.floor(i / 9) === 5) cls += ' block-bottom';
        if (fixed[i]) cls += ' fixed';
        if (i === selected) cls += ' selected';
        else if (selected >= 0 && related(i, selected)) cls += ' related';
        if (errors[i]) cls += ' error';
        html += '<div class="' + cls + '" onclick="selectCell(' + i + ')">' + board[i] + '</div>';
      }
      document.getElementById('board').innerHTML = html;
    }

    function related(a, b) {
      var ar = Math.floor(a / 9);
      var ac = a % 9;
      var br = Math.floor(b / 9);
      var bc = b % 9;
      return ar === br || ac === bc || (Math.floor(ar / 3) === Math.floor(br / 3) && Math.floor(ac / 3) === Math.floor(bc / 3));
    }

    function selectCell(index) {
      if (finished) return;
      selected = index;
      draw();
    }

    function putNumber(num) {
      if (selected < 0 || fixed[selected] || finished) return;
      board[selected] = String(num);
      errors = [];
      document.getElementById('mistakes').innerHTML = '0';
      document.getElementById('status').innerHTML = '继续填写，完成后点击验证。';
      draw();
    }

    function clearCell() {
      if (selected < 0 || fixed[selected] || finished) return;
      board[selected] = '';
      errors = [];
      document.getElementById('mistakes').innerHTML = '0';
      document.getElementById('status').innerHTML = '已清除当前格子，完成后点击验证。';
      draw();
    }

    function verifyBoard() {
      if (finished) return;
      errors = [];
      mistakes = 0;
      for (var i = 0; i < 81; i++) {
        if (!board[i]) {
          document.getElementById('status').innerHTML = '还有空格没有填写，填完后再验证。';
          document.getElementById('mistakes').innerHTML = '0';
          draw();
          return;
        }
        if (board[i] !== solution.charAt(i)) {
          errors[i] = true;
          mistakes++;
        }
      }
      document.getElementById('mistakes').innerHTML = String(mistakes);
      if (mistakes === 0) {
        finished = true;
        clearInterval(timer);
        document.getElementById('status').innerHTML = '全部正确！用时 ' + document.getElementById('time').innerHTML + '。';
      } else {
        document.getElementById('status').innerHTML = '有 ' + mistakes + ' 个错误，红色格子需要修改。';
      }
      draw();
    }

    document.onkeydown = function(event) {
      event = event || window.event;
      var key = event.key || event.keyCode;
      if (key >= '1' && key <= '9') {
        putNumber(Number(key));
        return false;
      }
      if (key >= 49 && key <= 57) {
        putNumber(key - 48);
        return false;
      }
      if (key === 'Backspace' || key === 'Delete' || key === 8 || key === 46 || key === '0' || key === 48) {
        clearCell();
        return false;
      }
    };

    newGame();
  </script>
</body>
</html>
