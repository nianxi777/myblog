<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>数独 - 溪_</title>
  <link rel="stylesheet" href="../css/games/sudoku.css?v=20260505-2">
</head>
<body>
  <main class="game-wrap">
    <section class="board-panel">
      <div class="board" id="board" aria-label="数独游戏区域"></div>
    </section>
    <aside class="side-panel">
      <section class="topbar">
        <h1>数独</h1>
        <div class="scores">
          <div class="score-box"><span>用时</span><strong id="time">00:00</strong></div>
          <div class="score-box"><span>错误</span><strong id="mistakes">0</strong></div>
        </div>
      </section>
      <p>选择空格后点数字标注候选数，长按数字填入正式答案。</p>
      <section class="numbers" aria-label="数字输入">
        <button type="button" onpointerdown="startNumberPress(1)" onpointerup="endNumberPress()" onpointerleave="cancelNumberPress()" onclick="numberClick(1)">1</button>
        <button type="button" onpointerdown="startNumberPress(2)" onpointerup="endNumberPress()" onpointerleave="cancelNumberPress()" onclick="numberClick(2)">2</button>
        <button type="button" onpointerdown="startNumberPress(3)" onpointerup="endNumberPress()" onpointerleave="cancelNumberPress()" onclick="numberClick(3)">3</button>
        <button type="button" onpointerdown="startNumberPress(4)" onpointerup="endNumberPress()" onpointerleave="cancelNumberPress()" onclick="numberClick(4)">4</button>
        <button type="button" onpointerdown="startNumberPress(5)" onpointerup="endNumberPress()" onpointerleave="cancelNumberPress()" onclick="numberClick(5)">5</button>
        <button type="button" onpointerdown="startNumberPress(6)" onpointerup="endNumberPress()" onpointerleave="cancelNumberPress()" onclick="numberClick(6)">6</button>
        <button type="button" onpointerdown="startNumberPress(7)" onpointerup="endNumberPress()" onpointerleave="cancelNumberPress()" onclick="numberClick(7)">7</button>
        <button type="button" onpointerdown="startNumberPress(8)" onpointerup="endNumberPress()" onpointerleave="cancelNumberPress()" onclick="numberClick(8)">8</button>
        <button type="button" onpointerdown="startNumberPress(9)" onpointerup="endNumberPress()" onpointerleave="cancelNumberPress()" onclick="numberClick(9)">9</button>
        <button type="button" onclick="clearCell()">清除</button>
      </section>
      <p class="status" id="status">游戏加载中...</p>
      <section class="puzzle-picker">
        <label for="puzzleSelect">题目选择</label>
        <select id="puzzleSelect" onchange="changePuzzle()" aria-label="选择数独题目"></select>
      </section>
      <section class="actions">
        <button type="button" onclick="verifyBoard()">验证</button>
        <button type="button" onclick="newGame()">新游戏</button>
        <button type="button" id="difficultyBtn" onclick="cycleDifficulty()">难度：简单</button>
        <a class="home-link" href="/myblog/">返回首页</a>
      </section>
    </aside>
  </main>
  <script src="../js/games/sudoku.js?v=20260505-2"></script>
</body>
</html>
